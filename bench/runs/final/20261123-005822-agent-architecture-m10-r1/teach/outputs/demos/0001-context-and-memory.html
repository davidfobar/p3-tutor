<!--
Kind: interactive graphic.
Core idea: the context window is a limited space that everything the model sees must share; old tool results are the lightest thing to clear, and compaction replaces the chat with a summary.
Notice: the window fills with every message, tool result and reply, and only clearing or summarizing makes room; and the model sees nothing that is not in it.
Section: 4 (What is kept between steps). Minutes: about 1.5 (plan section 4 is 1.5 min; the visible text, about 100 words, is a little over the quarter-of-section budget of about 56, because the controls and legend need words).

Layout check (SVG viewBox 0 0 640 110; font 18; widths = chars x 10.8; all in viewBox units):
Frame: everything between x 10..630 and y 10..100+ (bottom of cells y=100, content bottom pad 10).
Count text "Window: N of 10 slots (example size)": x 22, baseline y 30, height y 15.6..34.5, inside the frame.
  Start state (N=2): 36 chars -> width 389, x 22..411 -> inside frame, 219 clear on the right.
  Fullest state (N=10): 37 chars -> width 400, x 22..422 -> inside frame, 208 clear on the right. Clear of the cells (cell top y 44 > text bottom 34.5).
Cells k = 0..9: rect x = 22 + 60k (22, 82, 142, 202, 262, 322, 382, 442, 502, 562), y 44, width 56, height 56, rx 8; right edge of last = 618 (inside frame, 12 clear); gaps between cells 4, so no overlap (accent stroke 2.5 adds 1.25 per side, still inside the gaps).
Cell letter (one per cell, S T U M R or the sigma): center x = cell x + 28, baseline y 78, width <= 10.8 (sigma/letters), height y 63.6..82.5. Inside its cell (y 44..100) with 19.6 clear above and 17.5 below; horizontally 22.6 clear each side.
  Start state: cell 0 "S", cell 1 "T" have letters; cells 2..9 are empty dashed (no label).
  Fullest state: cells 0..9 read S T U M R M R M R M; every letter row passes the same numbers.
Nothing overlaps: no label crosses another label, a cell edge or a line; there are no arrows in this graphic.
Layout check: passed
-->
<section class="demo" aria-labelledby="demo-heading">
<style>
.demo { border: 1px solid var(--rule); border-radius: 6px; padding: 1rem 1.25rem; margin: 1.75rem 0; font-family: var(--sans); }
.demo h3 { margin: 0 0 0.5rem; font-size: 1rem; }
.demo svg { display: block; width: 100%; height: auto; color: var(--text); }
.demo .cell { fill: none; stroke: currentColor; stroke-width: 1.5; }
.demo .cell.empty { stroke: var(--muted); stroke-dasharray: 4 4; }
.demo .cell.R { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
.demo .cell.G { fill: var(--ok-soft); stroke: var(--ok); }
.demo svg text { fill: currentColor; font-family: system-ui, sans-serif; font-size: 18px; }
.demo .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0; }
.demo button { font: inherit; font-size: 0.9rem; color: inherit; background: transparent; border: 1px solid var(--rule); border-radius: 6px; padding: 0.45rem 0.8rem; cursor: pointer; }
.demo button:hover { border-color: var(--accent); }
.demo button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.demo .legend { font-size: 0.8rem; color: var(--muted); margin: 0.5rem 0; }
.demo .readout { font-size: 0.95rem; min-height: 3em; margin: 0.5rem 0; padding: 0.5rem 0.75rem; background: var(--accent-soft); border-radius: 6px; }
.demo ul.prompts { font-size: 0.9rem; margin: 0.5rem 0 0; padding-left: 1.2rem; }
</style>
<h3 id="demo-heading">Fill the window</h3>
<svg viewBox="0 0 640 110" role="img" aria-labelledby="demo-title">
  <title id="demo-title">A row of ten slots, the context window. Slots fill with the system prompt, tool definitions, messages, tool results and replies.</title>
  <text id="demo-count" x="22" y="30">Window: 2 of 10 slots (example size)</text>
  <g id="demo-cells"></g>
</svg>
<p class="legend">S system, T tools, U question, M reply, R result, &Sigma; summary</p>
<div class="controls">
  <button type="button" data-act="next">Next step</button>
  <button type="button" data-act="clear">Clear tool results</button>
  <button type="button" data-act="sum">Summarize</button>
  <button type="button" data-act="ask">Ask about last chat</button>
  <button type="button" data-act="reset">Reset</button>
</div>
<p class="readout" aria-live="polite" id="demo-readout"></p>
<ul class="prompts">
  <li>Predict: after how many Next steps is the window full?</li>
  <li>When full, try Clear, then Reset and try Summarize. What does each lose?</li>
</ul>
<script>
(function () {
  var root = document.getElementById("demo-heading").parentNode;
  var N = 10;
  var names = { S: "system prompt", T: "tool definitions", U: "student message", M: "model reply", R: "tool result", G: "summary" };
  var steps = [
    { add: ["U"], say: "The student asks to book the laser cutter. The question joins the window." },
    { add: ["M", "R"], say: "The model asks for a manual page. Its request and the page that comes back both take space." },
    { add: ["M", "R"], say: "It checks the calendar. Another request, another result." },
    { add: ["M", "R"], say: "It books the slot, and the confirmation joins." },
    { add: ["M"], say: "The model writes its answer. Its own reply takes space too. The window is full." }
  ];
  var win, i;
  var cells = root.querySelector("#demo-cells");
  var count = root.querySelector("#demo-count");
  var out = root.querySelector("#demo-readout");
  var NS = "http://www.w3.org/2000/svg";

  function say(t) { out.textContent = t; }
  function render() {
    while (cells.firstChild) { cells.removeChild(cells.firstChild); }
    for (var k = 0; k < N; k++) {
      var c = win[k];
      var g = document.createElementNS(NS, "g");
      var r = document.createElementNS(NS, "rect");
      r.setAttribute("x", 22 + 60 * k); r.setAttribute("y", 44);
      r.setAttribute("width", 56); r.setAttribute("height", 56); r.setAttribute("rx", 8);
      r.setAttribute("class", "cell " + (c ? c : "empty"));
      g.appendChild(r);
      if (c) {
        var t = document.createElementNS(NS, "text");
        t.setAttribute("x", 50 + 60 * k); t.setAttribute("y", 78); t.setAttribute("text-anchor", "middle");
        t.textContent = c === "G" ? "Σ" : c;
        var ti = document.createElementNS(NS, "title");
        ti.textContent = names[c];
        g.appendChild(ti); g.appendChild(t);
      }
      cells.appendChild(g);
    }
    count.textContent = "Window: " + win.length + " of " + N + " slots (example size)";
  }
  function reset() {
    win = ["S", "T"]; i = 0; render();
    say("Start: the system prompt and tool definitions already take 2 slots.");
  }
  function next() {
    var s = steps[i] || { add: ["U"], say: "A new student question joins the window." };
    if (win.length + s.add.length > N) {
      say("No room: the next message does not fit. Clear tool results or summarize first.");
      return;
    }
    win = win.concat(s.add); i++; render(); say(s.say);
  }
  function clearResults() {
    var kept = win.filter(function (c) { return c !== "R"; });
    if (kept.length === win.length) { say("No tool results to clear."); return; }
    win = kept; render();
    say("Old tool results cleared, the lightest thing to drop. Questions and replies stay.");
  }
  function summarize() {
    if (win.length <= 2 || (win.length === 3 && win[2] === "G")) { say("Nothing to summarize yet."); return; }
    win = ["S", "T", "G"]; render();
    say("Summarized: the chat restarts from one summary slot. Left-out details are gone.");
  }
  function ask() {
    say("Not in the window, so the model cannot see it. Only saved notes could carry it over.");
  }
  var actions = { next: next, clear: clearResults, sum: summarize, ask: ask, reset: reset };
  root.querySelectorAll("button[data-act]").forEach(function (b) {
    b.addEventListener("click", function () { actions[b.getAttribute("data-act")](); });
  });
  reset();
})();
</script>
</section>
